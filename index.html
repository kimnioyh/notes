<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공부 노트</title>
<link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
<style>
  :root{
    --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0;
    --sidebar:#f6f8fa; --accent:#0969da; --sel:#ddf4ff;
  }
  :root[data-theme="dark"]{
    --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#30363d;
    --sidebar:#161b22; --accent:#4493f8; --sel:#193050;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    color:var(--fg); background:var(--bg);
    display:flex; height:100%; overflow:hidden;
  }
  /* 사이드바 */
  #sidebar{
    width:300px; flex:none; background:var(--sidebar);
    border-right:1px solid var(--line); overflow-y:auto; padding:12px 0;
  }
  #sidebar header{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 16px 14px; gap:8px;
  }
  #sidebar h1{font-size:15px; margin:0; letter-spacing:.02em}
  #theme{
    border:1px solid var(--line); background:transparent; color:var(--fg);
    border-radius:6px; padding:4px 8px; cursor:pointer; font-size:14px;
  }
  .cat{padding:14px 16px 4px; font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
  .item{display:block; padding:7px 16px; color:var(--fg); text-decoration:none;
    font-size:14.5px; border-left:3px solid transparent; cursor:pointer}
  .item:hover{background:rgba(127,127,127,.08)}
  .item.active{background:var(--sel); border-left-color:var(--accent); font-weight:600}
  /* 본문 */
  #main{flex:1; overflow-y:auto}
  #back{display:none}
  article{max-width:820px; margin:0 auto; padding:40px 28px 120px}
  article h1,article h2,article h3{line-height:1.3}
  article h1{font-size:1.9em; margin:.2em 0 .6em; border-bottom:1px solid var(--line); padding-bottom:.3em}
  article h2{margin-top:1.8em; border-bottom:1px solid var(--line); padding-bottom:.25em}
  article a{color:var(--accent)}
  article code{background:rgba(127,127,127,.15); padding:.15em .4em; border-radius:5px; font-size:.9em}
  article pre{overflow-x:auto; border:1px solid var(--line); border-radius:8px; padding:14px}
  article pre code{background:none; padding:0; font-size:.88em}
  article table{border-collapse:collapse; display:block; overflow-x:auto; max-width:100%}
  article th,article td{border:1px solid var(--line); padding:6px 12px}
  article blockquote{margin:1em 0; padding:.2em 1em; border-left:4px solid var(--line); color:var(--muted)}
  article img{max-width:100%}
  #placeholder{color:var(--muted); text-align:center; margin-top:20vh}
  @media (max-width:720px){
    #sidebar{position:fixed; inset:0; width:100%; z-index:10}
    #main{width:100%}
    body.reading #sidebar{display:none}
    body:not(.reading) #main{display:none}
    #back{display:inline-block; position:sticky; top:0; z-index:5;
      background:var(--bg); border:none; border-bottom:1px solid var(--line);
      color:var(--accent); width:100%; text-align:left; padding:12px 16px;
      font-size:15px; cursor:pointer}
    article{padding:20px 18px 120px}
  }
</style>
</head>
<body>
  <nav id="sidebar">
    <header>
      <h1>📚 공부 노트</h1>
      <button id="theme" title="테마 전환">🌙</button>
    </header>
    <div id="list"></div>
  </nav>
  <main id="main">
    <button id="back">← 목록</button>
    <article id="content"><div id="placeholder">왼쪽에서 노트를 선택하세요</div></article>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(async function(){
  // ---- 테마 ----
  const lightCss=document.getElementById('hljs-light'), darkCss=document.getElementById('hljs-dark');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    document.getElementById('theme').textContent = t==='dark' ? '☀️' : '🌙';
    lightCss.disabled = t==='dark'; darkCss.disabled = t!=='dark';
  }
  const saved = localStorage.getItem('theme');
  applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
  document.getElementById('theme').onclick = ()=>{
    const t = document.documentElement.getAttribute('data-theme')==='dark' ? 'light':'dark';
    localStorage.setItem('theme',t); applyTheme(t);
  };

  // ---- 목록 ----
  const list=document.getElementById('list'), content=document.getElementById('content');
  let notes=[];
  try{
    notes = await (await fetch('manifest.json',{cache:'no-cache'})).json();
  }catch(e){
    content.innerHTML='<div id="placeholder">manifest.json을 불러오지 못했습니다.</div>'; return;
  }
  const byCat={};
  notes.forEach(n=>{ (byCat[n.category]=byCat[n.category]||[]).push(n); });
  for(const cat of Object.keys(byCat)){
    const h=document.createElement('div'); h.className='cat'; h.textContent=cat; list.appendChild(h);
    byCat[cat].forEach(n=>{
      const a=document.createElement('a');
      a.className='item'; a.textContent=n.title; a.href='#'+encodeURIComponent(n.path);
      a.dataset.path=n.path; list.appendChild(a);
    });
  }

  // ---- 노트 렌더 ----
  async function open(path){
    const note = notes.find(n=>n.path===path);
    if(!note){ return; }
    document.querySelectorAll('.item').forEach(el=>el.classList.toggle('active', el.dataset.path===path));
    content.innerHTML='<div id="placeholder">불러오는 중…</div>';
    document.body.classList.add('reading');
    try{
      const md = await (await fetch(path,{cache:'no-cache'})).text();
      content.innerHTML = marked.parse(md);
      content.querySelectorAll('pre code').forEach(b=>hljs.highlightElement(b));
      document.getElementById('main').scrollTop=0;
    }catch(e){
      content.innerHTML='<div id="placeholder">노트를 불러오지 못했습니다.</div>';
    }
  }

  document.getElementById('back').onclick=()=>{
    document.body.classList.remove('reading'); location.hash='';
  };
  window.addEventListener('hashchange', route);
  function route(){
    const p = decodeURIComponent(location.hash.slice(1));
    if(p) open(p); else document.body.classList.remove('reading');
  }
  route();
})();
</script>
</body>
</html>
